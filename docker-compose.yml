name: importadesioni-local

services:

  functions:
    profiles: ["legacy"]
    image: functions-template:v2.0.0
    build:
      context: ./
      dockerfile: docker/functions/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - languageWorkers__node__arguments=--inspect=0.0.0.0:5858
    working_dir: /usr/src/app
    ports:
      - "7071:7071"
      - "5858:5858"
    networks:
      - io-fn
    depends_on:
      - fnstorage
    volumes:
      - .:/usr/src/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.functions.rule=Host(`localhost`)"
      - "traefik.http.routers.functions.entrypoints=web"
      - "traefik.http.services.functions.loadbalancer.server.port=7071"

      - "traefik.http.middlewares.testHeader.headers.customrequestheaders.x-user-id=unused"
      - "traefik.http.middlewares.testHeader.headers.customrequestheaders.x-user-groups=${REQ_USER_GROUPS:-}"
      - "traefik.http.middlewares.testHeader.headers.customrequestheaders.x-subscription-id=${REQ_SERVICE_ID:-}"
      - "traefik.http.middlewares.testHeader.headers.customrequestheaders.x-user-email=${SERVICE_EMAIL:-}"
      - "traefik.http.middlewares.testHeader.headers.customrequestheaders.x-user-note=unused"
      - "traefik.http.middlewares.testHeader.headers.customrequestheaders.x-functions-key=unused"

      # apply middleware to route
      - "traefik.http.routers.functions.middlewares=testHeader"

  fnstorage:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - io-fn

  storage:
    profiles: ["extra-storage"]
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10003:10000"
      - "127.0.0.1:10004:10001"
      - "127.0.0.1:10005:10002"
    volumes:
      - storage-data:/data
    depends_on:
      - fnstorage
    networks:
      - io-fn

  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    environment:
      PROTOCOL: https
      EXPLORER_PROTOCOL: http
      ENABLE_TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:1234:1234"
    volumes:
      - cosmos-data:/data
    networks:
      - io-fn

  traefik:
    profiles: ["legacy"]
    image: traefik:v2.0
    command: |-
      --entrypoints.web.address=:80
      --providers.docker=true
      --providers.docker.network=io-fn
      --log.level=ERROR
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT:-8088}:80"
    networks:
      - io-fn
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  io-fn:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450

volumes:
  cosmos-data:
  azurite-data:
  storage-data:
